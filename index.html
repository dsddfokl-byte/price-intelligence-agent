<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楽天市場商品検索API 接続テスト</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px; color: #222; }
    h1 { font-size: 1.5rem; }
    .notice { padding: 12px; background: #fff5d9; border-radius: 6px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; }
    button { margin-top: 20px; padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { margin-top: 24px; font-weight: 700; }
    pre { min-height: 80px; padding: 14px; overflow-wrap: anywhere; white-space: pre-wrap; background: #f5f5f5; border-radius: 6px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>楽天市場商品検索API 接続テスト</h1>
    <p class="notice">入力した認証情報は保存せず、実行時のAPIリクエストだけに使用します。</p>

    <form id="search-form" autocomplete="off">
      <label for="application-id">Application ID（必須）</label>
      <input id="application-id" name="application-id" type="password" required autocomplete="off">

      <label for="access-key">Access Key（必須）</label>
      <input id="access-key" name="access-key" type="password" required autocomplete="off">

      <label for="affiliate-id">Affiliate ID（任意）</label>
      <input id="affiliate-id" name="affiliate-id" type="password" autocomplete="off">

      <button id="submit-button" type="submit">APIを実行</button>
    </form>

    <div id="status" role="status" aria-live="polite">HTTP status: 未実行</div>
    <h2>レスポンスJSON（先頭部分）</h2>
    <pre id="result">実行ボタンを押すと、ここに結果が表示されます。</pre>
  </main>

  <footer>
    <!-- Rakuten Web Services Attribution Snippet FROM HERE -->
    <a href="https://webservice.rakuten.co.jp/" target="_blank"><img src="https://webservice.rakuten.co.jp/img/credit/200709/credit_22121.gif" border="0" alt="Rakuten Web Service Center" title="Rakuten Web Service Center" width="221" height="21"/></a>
    <!-- Rakuten Web Services Attribution Snippet TO HERE -->
  </footer>

  <script>
    "use strict";

    const API_URL = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701";
    const form = document.getElementById("search-form");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    function redact(text, secrets) {
      return secrets.reduce(
        (safeText, secret) => secret ? safeText.split(secret).join("[REDACTED]") : safeText,
        text
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const applicationId = document.getElementById("application-id").value.trim();
      const accessKey = document.getElementById("access-key").value.trim();
      const affiliateId = document.getElementById("affiliate-id").value.trim();
      const secrets = [applicationId, accessKey, affiliateId];
      const params = new URLSearchParams({
        applicationId,
        accessKey,
        keyword: "猫 フード",
        hits: "5"
      });

      if (affiliateId) {
        params.set("affiliateId", affiliateId);
      }

      submitButton.disabled = true;
      status.textContent = "HTTP status: リクエスト中";
      result.textContent = "応答を待っています…";

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`, {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });
        const body = await response.text();
        let formattedBody = body;

        try {
          formattedBody = JSON.stringify(JSON.parse(body), null, 2);
        } catch (_) {
          // JSON以外の応答も調査できるよう、そのまま表示する。
        }

        status.textContent = `HTTP status: ${response.status} ${response.statusText}`;
        result.textContent = redact(formattedBody.slice(0, 4000), secrets);
      } catch (error) {
        status.textContent = "HTTP status: 取得不能";
        result.textContent =
          "リクエストに失敗しました。ブラウザの開発者ツールを確認してください。\n" +
          "CORSポリシー、ネットワーク接続、またはブラウザ拡張機能によって遮断された可能性があります。\n" +
          `概要: ${redact(error instanceof Error ? error.message : "不明なエラー", secrets)}`;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
